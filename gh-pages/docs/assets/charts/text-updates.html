<figure class="benchmark-chart" data-benchmark="text-updates" style="--chart-max: 100">
  <figcaption>Token savings from sending only changes</figcaption>
  <ul>
    <li style="--chart-value: 84">
      <span class="benchmark-chart__label">Excel worksheet editing</span>
      <span class="benchmark-chart__value">84.0%</span>
      <span class="benchmark-chart__track" aria-hidden="true"><span class="benchmark-chart__bar"></span></span>
    </li>
    <li style="--chart-value: 86.1">
      <span class="benchmark-chart__label">Word document editing</span>
      <span class="benchmark-chart__value">86.1%</span>
      <span class="benchmark-chart__track" aria-hidden="true"><span class="benchmark-chart__bar"></span></span>
    </li>
    <li style="--chart-value: 96.6">
      <span class="benchmark-chart__label">Desktop test app navigation</span>
      <span class="benchmark-chart__value">96.6%</span>
      <span class="benchmark-chart__track" aria-hidden="true"><span class="benchmark-chart__bar"></span></span>
    </li>
  </ul>
  <div class="benchmark-chart__scale" aria-hidden="true"><span>0%</span><span>100% fewer tokens</span></div>
  <p class="benchmark-chart__note">Longer bars mean greater savings. Compared with repeating the whole window as text. First read not counted.</p>
</figure>
