[project]
name = "windows-usage-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-skill-engineering==0.6.21",
    "psutil>=7.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pywin32>=312; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../scripts"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "usage_live: manually approved Windows desktop and model usage",
    "comparison_live: manually approved controls versus screenshots comparison",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
